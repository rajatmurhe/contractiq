name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/contractiq

jobs:
  # ─── .NET Build & Test ──────────────────────────────────────────────────────
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ContractIQ_Dev!2024
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ContractIQ_Dev!2024 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/backend/ContractIQ.sln

      - name: Build
        run: dotnet build src/backend/ContractIQ.sln --configuration Release --no-restore

      - name: Check format
        run: dotnet format src/backend/ContractIQ.sln --verify-no-changes

      - name: Run tests
        run: |
          dotnet test src/backend/ContractIQ.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFileName=results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;Database=ContractIQ_Test;User Id=sa;Password=ContractIQ_Dev!2024;TrustServerCertificate=True"
          REDIS_CONNECTION_STRING: "localhost:6379"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: TestResults/**/coverage.cobertura.xml

      - name: Check vulnerable dependencies
        run: dotnet list src/backend/ContractIQ.sln package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt && ! grep -q "has the following vulnerable packages" vuln-report.txt

  # ─── Python Build & Test ────────────────────────────────────────────────────
  python:
    name: Python Build & Test
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install agent dependencies
        run: cd src/agent && uv pip install -e ".[dev]" --python 3.12 --system

      - name: Install mcp-server dependencies
        run: cd src/mcp-server && uv pip install -e ".[dev]" --python 3.12 --system

      - name: Lint (ruff)
        run: |
          cd src/agent && python -m ruff check app/ tests/
          cd src/mcp-server && python -m ruff check app/

      - name: Type check (mypy)
        run: |
          cd src/agent && python -m mypy app/ --strict
          cd src/mcp-server && python -m mypy app/ --strict

      - name: Run tests
        run: |
          cd src/agent && python -m pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short
        env:
          LLM_PROVIDER: fake
          QDRANT_URL: http://localhost:6333

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: src/agent/coverage.xml

      - name: Audit pip packages
        run: cd src/agent && pip-audit --requirement pyproject.toml --skip-editable || true

  # ─── Frontend Build & Test ──────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: cd src/frontend && npm ci

      - name: Type check
        run: cd src/frontend && npm run type-check

      - name: Lint
        run: cd src/frontend && npm run lint

      - name: Unit tests
        run: cd src/frontend && npm run test:unit -- --coverage

      - name: Build
        run: cd src/frontend && npm run build

      - name: npm audit
        run: cd src/frontend && npm audit --audit-level=high

  # ─── Security Scanning ──────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [dotnet, python, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json > docs/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: docs/sbom.json

  # ─── Contract Tests (Pact) ──────────────────────────────────────────────────
  contract-tests:
    name: Pact Contract Tests
    runs-on: ubuntu-latest
    needs: [dotnet, python]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & run contract tests
        run: |
          cd tests/contract && npm ci && npm test

  # ─── CI Summary ─────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [dotnet, python, frontend, security, contract-tests]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.dotnet.result }}" != "success" ]] || \
             [[ "${{ needs.python.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.contract-tests.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed."

name: Review pilot
on:
  push:
    paths: ['src/frontend/**', 'src/agent/app/review/**', 'src/agent/tests/test_review_api.py', 'requirements-review.txt', '.github/workflows/review.yml']
  pull_request:
    paths: ['src/frontend/**', 'src/agent/app/review/**', 'src/agent/tests/test_review_api.py', 'requirements-review.txt', '.github/workflows/review.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: pip install -r requirements-review.txt pytest pytest-asyncio
      - run: PYTHONPATH=src/agent pytest src/agent/tests/test_review_api.py -q
      - run: npm ci && npm run type-check && npm run build
        working-directory: src/frontend

name: Review corpus validation
on:
  push:
    branches: [main, develop]
    paths: ['src/agent/app/review/**', 'evals/review/**', '.github/workflows/eval.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/agent/app/review/**', 'evals/review/**', '.github/workflows/eval.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-review.txt
      - name: Validate synthetic cases (no inference or accuracy claim)
        run: PYTHONPATH=src/agent python -m app.review.evaluate --output /tmp/corpus-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-validation
          path: /tmp/corpus-validation.json
